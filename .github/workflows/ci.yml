name: CI

on:
  push:
    branches: ['**']

permissions:
  contents: read

# A newer push to the same branch makes an older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # gitleaks scans the whole history

      # Secrets first, before anything else is installed, so a leak fails the run straight away.
      - name: Install gitleaks
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$tarball" "$base/$tarball"
          curl -sSfL -o checksums.txt "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " $tarball\$" checksums.txt | sha256sum --check -
          tar -xzf "$tarball" gitleaks
          sudo install gitleaks /usr/local/bin/
          rm -f gitleaks "$tarball" checksums.txt

      - name: Scan for secrets
        run: gitleaks git --redact --no-banner

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      # setup-uv publishes exact versions only; with no `version` it installs the latest uv.
      - uses: astral-sh/setup-uv@v10.4.0

      - name: Install dependencies
        run: npm ci

      # Playwright uses the Google Chrome already installed on the runner (channel: 'chrome').
      - name: npm run check
        run: npm run check

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: ignore
