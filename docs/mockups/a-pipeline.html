<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mockup A: Pipeline</title>
<link rel="stylesheet" href="base.css">
<link rel="stylesheet" href="a.css">
</head>
<body>
<div class="app">
  <aside class="side" id="side"></aside>
  <main class="main">
    <header class="head">
      <div>
        <h1>Pipeline</h1>
        <p class="sub">Drag a card to change its stage or its place in a column.</p>
      </div>
      <div class="board-sum" id="sum"></div>
    </header>
    <div class="toolbar">
      <div class="search"><span class="ic" data-i="search"></span>Search deals</div>
      <button class="btn"><span class="ic" data-i="plus"></span>New deal</button>
    </div>
    <section class="board" id="board"></section>
  </main>
</div>
<script src="mock-data.js"></script>
<script src="charts.js"></script>
<script src="a-shell.js"></script>
<script>
  shell("Pipeline");
  document.getElementById("sum").innerHTML = `
    <div><span class="lbl">Open value</span><span class="num">${money(KPI.openValue)}</span></div>
    <div><span class="lbl">Expected revenue</span><span class="num">${money(KPI.openExpected)}</span></div>`;
  document.getElementById("board").innerHTML = STAGES.map((s) => {
    const ds = dealsIn(s.key);
    const closed = !OPEN_STAGES.includes(s.key);
    const cards = ds.map((d, i) => `
      ${s.key === "Proposal" && i === 1 ? '<div class="drop"></div>' : ""}
      <div class="card ${isLate(d) ? "late" : ""} ${s.key === "Proposal" && i === 0 ? "drag" : ""}">
        <div class="cn">${d.name}</div>
        <div class="co">${d.org}</div>
        <div class="cf"><span class="cv num">${money(d.value)}</span>
          ${isLate(d) ? '<span class="late-tag">Late</span>' : ""}</div>
        <div class="cf"><span class="cd num">${shortDate(d.close)}</span><span class="num" style="color:var(--muted)">${d.prob}%</span></div>
      </div>`).join("");
    return `<div class="col ${closed ? "closed" : ""}">
      <div class="col-h">
        <div class="col-t"><span class="sw" style="background:${s.color}"></span>${s.key}<span class="ct">${ds.length}</span></div>
        <div class="col-m"><span>Value <b class="num">${moneyShort(sum(ds, (d) => d.value))}</b></span>
          <span>Expected <b class="num">${moneyShort(sum(ds, expected))}</b></span></div>
      </div>
      ${cards}
      <div class="add"><svg viewBox="0 0 24 24">${ICON.plus.replace(/<\/?svg[^>]*>/g, "")}</svg>Add deal</div>
    </div>`;
  }).join("");
  document.querySelectorAll("[data-i]").forEach((e) => (e.innerHTML = ICON[e.dataset.i]));
</script>
</body>
</html>
